<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小圆阅读器</title>
<style>
:root{--bg:#ececec;--fg:#1f1f1f;--ui:rgba(250,250,250,.96);--uifg:#222;--line:rgba(0,0,0,.12);--acc:#3a6ea5;--mask:255,255,255;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--fg:#c9c9c9;--ui:rgba(36,37,40,.96);--uifg:#ddd;--line:rgba(255,255,255,.14);--acc:#7fb0e6;--mask:0,0,0}}
:root[data-theme="dark"]{--bg:#17181a;--fg:#c9c9c9;--ui:rgba(36,37,40,.96);--uifg:#ddd;--line:rgba(255,255,255,.14);--acc:#7fb0e6;--mask:0,0,0}
:root[data-theme="sepia"]{--bg:#f3e8cf;--fg:#3b2f1e;--mask:243,232,207}
:root[data-theme="green"]{--bg:#d4e6d2;--fg:#22331f;--mask:212,230,210}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--fg);font-family:"PingFang SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;font-weight:400}
#bg,#mask{position:fixed;inset:0;z-index:0;pointer-events:none}
#bg{background:center/cover no-repeat;display:none}
#mask{background:rgb(var(--mask));opacity:0}
#reader{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:28px 22px 80px;font-size:var(--fs,20px);line-height:1.65;word-break:break-word}
#reader p{margin:0 0 .85em}
#reader .tip{text-align:center;opacity:.55;margin-top:30vh;font-size:16px;line-height:2}
.ui{position:fixed;left:0;right:0;z-index:5;background:var(--ui);color:var(--uifg);font:14px/1.4 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;transition:transform .25s}
#bar{top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
#bar b{font-weight:600;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panel{bottom:0;padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:1px solid var(--line);display:grid;gap:14px}
.hide #bar{transform:translateY(-110%)}.hide #panel{transform:translateY(110%)}
.row{display:flex;align-items:center;gap:10px}.row>span:first-child{width:44px;flex:none;opacity:.7}
button,label.btn{font:inherit;color:var(--uifg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:active,label.btn:active{background:var(--line)}
input[type=range]{flex:1;accent-color:var(--acc)}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid var(--line)}
.sw.on{border-color:var(--acc)}
input[type=file]{display:none}
#fsv{width:34px;text-align:center}
</style>
</head>
<body>
<div id="bg"></div><div id="mask"></div>
<header id="bar" class="ui"><b id="title">小圆阅读器</b>
<span class="row"><button id="shelfBtn" type="button">书架</button><button id="tocBtn" type="button">目录</button><label class="btn" for="f">导入 txt / word</label></span></header>
<main id="reader"><div class="tip">点击右上角「导入」<br>选择 .txt、.doc 或 .docx 文件开始阅读<br>点击屏幕空白处可隐藏 / 显示菜单</div></main>
<section id="panel" class="ui">
<div class="row"><span>字号</span><button id="m">A−</button><input id="fs" type="range" min="14" max="40" step="1"><button id="p">A+</button><span id="fsv"></span></div>
<div class="row"><span>背景</span>
<button class="sw" data-t="light" style="background:#ececec" title="浅灰"></button>
<button class="sw" data-t="sepia" style="background:#f3e8cf" title="米黄"></button>
<button class="sw" data-t="green" style="background:#d4e6d2" title="护眼"></button>
<button class="sw" data-t="dark" style="background:#17181a" title="夜间"></button>
<label class="btn" for="img">图片</label><button id="clr">清除</button></div>
<div class="row"><span>遮罩</span><input id="mk" type="range" min="0" max="90" step="5"><span id="mkv" style="width:40px"></span></div>
</section>
<input type="file" id="f" accept=".txt,.doc,.docx,text/plain">
<input type="file" id="img" accept="image/*">
<div id="shelfBox" class="ui" style="top:55px;left:10px;right:10px;max-width:760px;margin:auto;padding:12px;border:1px solid var(--line);border-radius:10px;display:none;max-height:55vh;overflow:auto">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>我的书架</b><button id="shelfClose">关闭</button></div>
  <div id="shelfList" style="display:grid;gap:6px"></div>
  <div style="font-size:12px;opacity:.65;margin-top:8px">小说保存在当前浏览器中。建议定期备份重要文本。</div>
</div>
<div id="tocBox" class="ui" style="top:55px;left:10px;right:10px;max-width:760px;margin:auto;padding:12px;border:1px solid var(--line);border-radius:10px;display:none;max-height:55vh;overflow:auto">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>章节目录</b><button id="tocClose">关闭</button></div>
  <div id="tocList" style="display:grid;gap:4px"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
<script>
const $=id=>document.getElementById(id),root=document.documentElement,R=$('reader');
const S={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let fs=+S.get('fs')||20;
function setFs(v){fs=Math.max(14,Math.min(40,v));R.style.setProperty('--fs',fs+'px');$('fs').value=fs;$('fsv').textContent=fs;S.set('fs',fs)}
$('m').onclick=()=>setFs(fs-1);$('p').onclick=()=>setFs(fs+1);$('fs').oninput=e=>setFs(+e.target.value);
setFs(fs);
function setTheme(t){if(t)root.dataset.theme=t;else delete root.dataset.theme;document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.t===t));S.set('theme',t||'')}
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
setTheme(S.get('theme')||'');
function setMask(v){$('mask').style.opacity=v/100;$('mk').value=v;$('mkv').textContent=v+'%';S.set('mask',v)}
$('mk').oninput=e=>setMask(+e.target.value);
function setBg(url){const b=$('bg');if(url){b.style.backgroundImage='url("'+url+'")';b.style.display='block'}else{b.style.display='none'}}
$('img').onchange=e=>{const file=e.target.files[0];if(!file)return;const u=URL.createObjectURL(file),im=new Image();
im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(u);setBg(d);S.set('bg',d);
if(!+$('mk').value)setMask(30)};im.src=u;e.target.value=''};
$('clr').onclick=()=>{setBg('');S.del('bg');setMask(0)};
function decode(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){try{return new TextDecoder('gbk').decode(buf)}catch(e2){return new TextDecoder().decode(buf)}}}
function render(text,name){
 const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
 R.innerHTML='';const fr=document.createDocumentFragment();
 lines.forEach(l=>{const p=document.createElement('p');p.textContent=l;fr.appendChild(p)});R.appendChild(fr);
 $('title').textContent=name||'小说阅读器';window.scrollTo(0,0)}
function parseDoc(buf){
 const d=new DataView(buf),u8=new Uint8Array(buf),END=0xFFFFFFFA;
 const ss=1<<d.getUint16(30,true),ms=1<<d.getUint16(32,true),cut=d.getUint32(56,true);
 const sec=i=>u8.subarray((i+1)*ss,(i+2)*ss);
 const fi=[];for(let i=0;i<109;i++){const v=d.getUint32(76+i*4,true);if(v<END)fi.push(v)}
 let dif=d.getUint32(68,true),nd=d.getUint32(72,true);
 while(nd-->0&&dif<END){const o=(dif+1)*ss;for(let i=0;i<ss/4-1;i++){const v=d.getUint32(o+i*4,true);if(v<END)fi.push(v)}dif=d.getUint32(o+ss-4,true)}
 const fat=[];fi.forEach(s=>{const o=(s+1)*ss;for(let i=0;i<ss/4;i++)fat.push(d.getUint32(o+i*4,true))});
 const chain=(s,t)=>{const r=[];let n=0;while(s<END&&n++<1e6){r.push(s);s=t[s]}return r};
 const cat=ps=>{let n=0;ps.forEach(p=>n+=p.length);const o=new Uint8Array(n);let k=0;ps.forEach(p=>{o.set(p,k);k+=p.length});return o};
 const dir=cat(chain(d.getUint32(48,true),fat).map(sec)),dv=new DataView(dir.buffer);
 const ents=[];
 for(let o=0;o+128<=dir.length;o+=128){const nl=dv.getUint16(o+64,true);let nm='';for(let i=0;i<nl/2-1;i++)nm+=String.fromCharCode(dv.getUint16(o+i*2,true));ents.push({nm,type:dir[o+66],start:dv.getUint32(o+116,true),size:dv.getUint32(o+120,true)})}
 const root=ents[0],mini=cat(chain(root.start,fat).map(sec)).subarray(0,root.size);
 const mf=cat(chain(d.getUint32(60,true),fat).map(sec)),mdv=new DataView(mf.buffer),mfat=[];
 for(let i=0;i<mf.length/4;i++)mfat.push(mdv.getUint32(i*4,true));
 const stream=e=>e.size<cut?cat(chain(e.start,mfat).map(s=>mini.subarray(s*ms,(s+1)*ms))).subarray(0,e.size):cat(chain(e.start,fat).map(sec)).subarray(0,e.size);
 const find=n=>ents.find(e=>e.nm===n&&e.type===2);
 const wd=find('WordDocument');if(!wd)throw new Error('不是有效的 Word 文件');
 const W=stream(wd),wv=new DataView(W.buffer),fl=wv.getUint16(10,true);
 if(fl&0x100)throw new Error('文件已加密，无法读取');
 const te=find(fl&0x200?'1Table':'0Table');if(!te)throw new Error('无法解析文件结构');
 const tb=stream(te),tv=new DataView(tb.buffer);
 const ccp=wv.getUint32(0x4C,true),fc0=wv.getUint32(0x1A2,true),lcb=wv.getUint32(0x1A6,true);
 let p=fc0;const end=fc0+lcb;
 while(p<end&&tb[p]===1)p+=3+tv.getUint16(p+1,true);
 if(tb[p]!==2)throw new Error('无法解析文本结构');
 const n=((tv.getUint32(p+1,true)-4)/12)|0,plc=p+5;let out='';
 for(let i=0;i<n;i++){
  const c0=tv.getUint32(plc+i*4,true),c1=tv.getUint32(plc+(i+1)*4,true);if(c0>=ccp)break;
  const len=Math.min(c1,ccp)-c0,fc=tv.getUint32(plc+(n+1)*4+i*8+2,true);
  if(fc&0x40000000){const o=(fc&0x3FFFFFFF)>>1;out+=new TextDecoder('windows-1252').decode(W.subarray(o,o+len))}
  else out+=new TextDecoder('utf-16le').decode(W.subarray(fc,fc+len*2));
 }
 return out.replace(/\x13[^\x14\x15]*\x14/g,'').replace(/[\x13\x15]/g,'').replace(/[\r\x0b\x0c\x07]+/g,'\n').replace(/[\x00-\x08\x0e-\x1f]/g,'');
}

// Enhanced shelf and chapter index; preserves the original page layout.
const LIBKEY='reader-library-original-layout-v1';
let library=[];try{library=JSON.parse(localStorage.getItem(LIBKEY)||'[]');if(!Array.isArray(library))library=[]}catch(e){library=[]}
let activeBookId=null;
function saveLibrary(){try{localStorage.setItem(LIBKEY,JSON.stringify(library))}catch(e){alert('书架存储空间不足，建议删除部分书籍或缩小文件。')}}
function safeName(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function drawShelf(){
 const box=$('shelfList');if(!library.length){box.innerHTML='<div style="opacity:.65;padding:10px">书架为空。导入小说后会自动加入书架。</div>';return}
 box.innerHTML=library.map(b=>'<div style="display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:7px 0"><button data-read="'+b.id+'" style="flex:1;text-align:left">'+safeName(b.name)+'</button><button data-remove="'+b.id+'">删除</button></div>').join('');
 box.querySelectorAll('[data-read]').forEach(btn=>btn.onclick=()=>{const b=library.find(x=>x.id===btn.dataset.read);if(!b)return;activeBookId=b.id;render(b.text,b.name);S.set('text',b.text);S.set('name',b.name);S.set('bookid',b.id);S.set('pos',b.pos||0);$('shelfBox').style.display='none';root.classList.add('hide');requestAnimationFrame(()=>{const h=document.body.scrollHeight-innerHeight;scrollTo(0,(b.pos||0)*Math.max(0,h))})});
 box.querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=()=>{if(!confirm('确定从书架删除这本小说吗？'))return;library=library.filter(x=>x.id!==btn.dataset.remove);saveLibrary();drawShelf()});
}
function buildToc(){
 const text=S.get('text')||'';const lines=text.split(/\r?\n/);const found=[];
 lines.forEach((line,i)=>{const s=line.trim();if(s&&s.length<55&&(/^(第[零〇一二三四五六七八九十百千万两\\d０-９]+[章节回卷部篇集幕].*)$/.test(s)||/^(序章|楔子|引子|后记|番外.*)$/.test(s)))found.push({title:s,line:i})});
 const list=$('tocList');
 if(!found.length){list.innerHTML='<div style="opacity:.65;padding:10px">没有识别到常见章节标题，仍可正常阅读。</div>';return}
 list.innerHTML=found.map((c,i)=>'<button data-line="'+c.line+'" style="text-align:left">'+safeName(c.title)+'</button>').join('');
 list.querySelectorAll('[data-line]').forEach(btn=>btn.onclick=()=>{const line=+btn.dataset.line;const paragraphs=Array.from($('reader').querySelectorAll('p'));const textLines=lines.filter(x=>x.trim());const idx=textLines.slice(0,line).filter(x=>x.trim()).length;const target=paragraphs[Math.min(idx,paragraphs.length-1)];if(target)target.scrollIntoView({behavior:'smooth',block:'start'});$('tocBox').style.display='none'});
}
$('shelfBtn').onclick=()=>{drawShelf();$('tocBox').style.display='none';$('shelfBox').style.display=$('shelfBox').style.display==='block'?'none':'block'};
$('shelfClose').onclick=()=>$('shelfBox').style.display='none';
$('tocBtn').onclick=()=>{buildToc();$('shelfBox').style.display='none';$('tocBox').style.display=$('tocBox').style.display==='block'?'none':'block'};
$('tocClose').onclick=()=>$('tocBox').style.display='none';

$('f').onchange=async e=>{const file=e.target.files[0];if(!file)return;const name=file.name.replace(/\.[^.]+$/,'');let text='';
 try{const buf=await file.arrayBuffer();
  const u8=new Uint8Array(buf);
  if(u8[0]===0x50&&u8[1]===0x4B)text=(await mammoth.extractRawText({arrayBuffer:buf})).value;
  else if(u8[0]===0xD0&&u8[1]===0xCF)text=parseDoc(buf);
  else if(String.fromCharCode(...u8.subarray(0,5))==='{\\rtf'){alert('这是 RTF 格式，请用 Word 另存为 .docx 后再导入');return}
  else text=decode(buf);
 }catch(err){alert('文件读取失败：'+err.message);return}
 render(text,name);S.set('text',text);S.set('name',name);S.del('pos');
  let b=library.find(x=>x.name===name);if(!b){b={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),name,text,pos:0};library.unshift(b)}else{b.text=text}
  activeBookId=b.id;saveLibrary();drawShelf();e.target.value='';root.classList.add('hide')};
R.onclick=()=>root.classList.toggle('hide');
let tm;addEventListener('scroll',()=>{clearTimeout(tm);tm=setTimeout(()=>{const h=document.body.scrollHeight-innerHeight;if(h>0){S.set('pos',scrollY/h);if(activeBookId){const b=library.find(x=>x.id===activeBookId);if(b){b.pos=scrollY/h;saveLibrary()}}}},300)});
// restore
const bg=S.get('bg');if(bg)setBg(bg);setMask(+S.get('mask')||0);
const t=S.get('text');if(t){render(t,S.get('name'));activeBookId=S.get('bookid')||null;requestAnimationFrame(()=>{const p=+S.get('pos');if(p)scrollTo(0,p*(document.body.scrollHeight-innerHeight))});root.classList.add('hide')}drawShelf()
</script>
</body>
</html>
